[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build_meta"

[project]
name = "crm-data-simulator"
version = "0.1.0"
description = "CRM Data Simulator for Round 1"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "huggingface_hub",
    "python-multipart",
    "openenv-core>=0.2.0"
]

[project.scripts]
server = "server.app:main"

[tool.hatch.build.targets.wheel]
packages = ["server"]
