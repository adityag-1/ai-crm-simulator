[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crm-data-simulator"
version = "0.1.0"
description = "CRM Data Simulator for Round 1"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "huggingface_hub",
    "python-multipart",
    "openenv-core>=0.2.0"
]

[project.scripts]
server = "server.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["server*"]
